# Start only after webcamd has created the selected V4L2 device.  The DESTROY
# event stops the root-owned service and removes its CUSE live nodes.
notify 100 {
	match "system"		"DEVFS";
	match "subsystem"	"CDEV";
	match "type"		"CREATE";
	match "cdev"		"video0";
	action "/usr/local/etc/rc.d/v4lliveview_safety start";
};

notify 100 {
	match "system"		"DEVFS";
	match "subsystem"	"CDEV";
	match "type"		"DESTROY";
	match "cdev"		"video0";
	action "/usr/local/etc/rc.d/v4lliveview_safety stop";
};
